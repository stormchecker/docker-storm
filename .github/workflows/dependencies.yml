name: Build base with dependencies
# Builds the Storm basesystem Docker images with dependencies and deploys them to GHCR and Dockerhub
# Build is distributed across multiple runners (one platform per runner) using Docker's reusable workflow, see:
# https://docs.docker.com/build/ci/github-actions/multi-platform/#distribute-build-across-multiple-runners
#
# Callers must grant `packages: write` (GHCR) and `id-token: write` (used to sign the provenance of the images).

on:
  # needed to trigger the workflow manually
  workflow_dispatch:
    inputs:
      push:
        description: 'Whether to push to GHCR and Dockerhub'
        required: true
        type: boolean
        default: true
  # needed to reuse the workflow from another one
  workflow_call:
    inputs:
      push:
        description: 'Whether to push to GHCR and Dockerhub'
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Build ${{ matrix.image.name }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - {name: "latest",
             baseImg: "ghcr.io/stormchecker/storm-basesystem:latest",
             file: "storm-dependencies/Dockerfile"
            }
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      job-name-prefix: storm-dependencies:${{ matrix.image.name }}
      push: ${{ inputs.push }}
      registry-login: ${{ inputs.push }}
      platforms: linux/amd64,linux/arm64
      file: ${{ matrix.image.file }}
      build-args: |
        BASE_IMAGE=${{ matrix.image.baseImg }}
        no_threads=4
      meta-images: |
        ghcr.io/stormchecker/storm-dependencies
        movesrwth/storm-dependencies
      # Use timestamped tag
      meta-tags: |
        type=raw,value=${{ matrix.image.name }}
        type=raw,value={{date 'YYYYMMDD'}}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        - registry: docker.io
          username: ${{ secrets.STORM_CI_DOCKER_USERNAME }}
          password: ${{ secrets.STORM_CI_DOCKER_TOKEN }}
