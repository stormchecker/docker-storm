name: Build basesystem
# Builds the Storm basesystem Docker images and deploys them to GHCR and Dockerhub
# Build is distributed across multiple runners (one platform per runner) using Docker's reusable workflow, see:
# https://docs.docker.com/build/ci/github-actions/multi-platform/#distribute-build-across-multiple-runners
#
# Callers must grant `packages: write` (GHCR) and `id-token: write` (used to sign the provenance of the images).

on:
  # needed to trigger the workflow manually
  workflow_dispatch:
    inputs:
      push:
        description: 'Whether to push to GHCR and Dockerhub'
        required: true
        type: boolean
        default: true
  # needed to reuse the workflow from another one
  workflow_call:
    inputs:
      push:
        description: 'Whether to push to GHCR and Dockerhub'
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Build ${{ matrix.image.name }}
    strategy:
      # Build all variants independently
      fail-fast: false
      matrix:
        image:
          - {name: "debian-12",
             baseImg: "debian:12",
             file: "storm-basesystem/Dockerfile"
            }
          - {name: "ubuntu-24.04",
             baseImg: "ubuntu:24.04",
             file: "storm-basesystem/Dockerfile"
            }
          - {name: "debian-13",
             baseImg: "debian:13",
             file: "storm-basesystem/Dockerfile"
            }
          - {name: "ubuntu-26.04",
             baseImg: "ubuntu:26.04",
             file: "storm-basesystem/Dockerfile"
            }
          - {name: "latest",
             baseImg: "ubuntu:rolling",
             file: "storm-basesystem/Dockerfile"
            }
          - {name: "minimal_dependencies",
             baseImg: "ubuntu:rolling",
             file: "storm-basesystem/Dockerfile.minimal_dependencies"
            }
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: ${{ inputs.push }}
      registry-login: ${{ inputs.push }}
      platforms: linux/amd64,linux/arm64
      file: ${{ matrix.image.file }}
      build-args: |
        BASE_IMAGE=${{ matrix.image.baseImg }}
      meta-images: |
        ghcr.io/stormchecker/storm-basesystem
        movesrwth/storm-basesystem
      meta-tags: |
        type=raw,${{ matrix.image.name }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        - registry: docker.io
          username: ${{ secrets.STORM_CI_DOCKER_USERNAME }}
          password: ${{ secrets.STORM_CI_DOCKER_TOKEN }}
